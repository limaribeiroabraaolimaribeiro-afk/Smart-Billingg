<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Billing Agent — Diagnóstico</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 32px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #94a3b8; margin-top: 0; font-size: 13px; }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .row span:first-child { color: #94a3b8; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ready { background: #064e3b; color: #6ee7b7; }
  .badge.pending { background: #78350f; color: #fcd34d; }
  .badge.error { background: #7f1d1d; color: #fca5a5; }
  img.qr { display: block; margin: 16px auto; width: 220px; height: 220px; border-radius: 8px; }
  button {
    background: #4338ca;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 4px 6px 0 0;
  }
  button.danger { background: #b91c1c; }
  button:disabled { opacity: .5; cursor: default; }
  input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 13px;
    margin-top: 6px;
  }
  #log {
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    color: #94a3b8;
    max-height: 160px;
    overflow-y: auto;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Smart Billing Agent</h1>
  <p class="sub">Página local de diagnóstico — não faz parte do painel principal do Smart Billing.</p>

  <div class="card">
    <div class="row"><span>Status</span><span id="status-badge">—</span></div>
    <div class="row"><span>Número</span><span id="phone">—</span></div>
    <div class="row"><span>Nome</span><span id="name">—</span></div>
    <div id="qr-holder"></div>
    <div id="error-holder"></div>
  </div>

  <div class="card">
    <button id="btn-start">Iniciar / Conectar</button>
    <button id="btn-restart">Reconectar</button>
    <button id="btn-new-qr">Gerar novo QR</button>
    <button id="btn-logout" class="danger">Desconectar do zero</button>
  </div>

  <div class="card">
    <label style="font-size:12px;color:#94a3b8;">Enviar mensagem de teste para (com DDD)</label>
    <input id="test-phone" placeholder="(47) 99999-9999" />
    <button id="btn-send-test" style="margin-top:10px;">Enviar teste</button>
  </div>

  <div class="card">
    <div id="log">Aguardando...</div>
  </div>
</div>

<script>
  function log(msg) {
    const el = document.getElementById('log');
    const line = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
    el.textContent = `${line}\n${el.textContent}`.slice(0, 4000);
  }

  async function api(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.message || `Erro ${res.status}`);
    return data;
  }

  function badgeClass(status) {
    if (status === 'ready') return 'ready';
    if (status === 'error' || status === 'disconnected') return 'error';
    return 'pending';
  }

  async function refresh() {
    try {
      const st = await api('/status');
      document.getElementById('status-badge').innerHTML = `<span class="badge ${badgeClass(st.status)}">${st.status}</span>`;
      document.getElementById('phone').textContent = st.phoneNumber || '—';
      document.getElementById('name').textContent = st.displayName || '—';

      const qrHolder = document.getElementById('qr-holder');
      qrHolder.innerHTML = (st.status === 'qr_required' && st.qrDataUrl)
        ? `<img class="qr" src="${st.qrDataUrl}" alt="QR Code" />`
        : '';

      const errHolder = document.getElementById('error-holder');
      errHolder.innerHTML = st.errorMessage ? `<p style="color:#fca5a5;font-size:12px;">${st.errorMessage}</p>` : '';
    } catch (err) {
      log(`Falha ao consultar status: ${err.message}`);
    }
  }

  document.getElementById('btn-start').addEventListener('click', async () => {
    try { await api('/start', { method: 'POST' }); log('Início solicitado.'); } catch (err) { log(err.message); }
  });
  document.getElementById('btn-restart').addEventListener('click', async () => {
    try { await api('/restart', { method: 'POST' }); log('Reconectando...'); } catch (err) { log(err.message); }
  });
  document.getElementById('btn-new-qr').addEventListener('click', async () => {
    try {
      await api('/restart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ forceNewQR: true }) });
      log('Gerando novo QR Code...');
    } catch (err) { log(err.message); }
  });
  document.getElementById('btn-logout').addEventListener('click', async () => {
    if (!confirm('Desconectar do zero? Você vai precisar escanear um novo QR Code.')) return;
    try { await api('/logout', { method: 'POST' }); log('Sessão encerrada.'); } catch (err) { log(err.message); }
  });
  document.getElementById('btn-send-test').addEventListener('click', async () => {
    const to = document.getElementById('test-phone').value;
    try {
      await api('/send-test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to }) });
      log(`Mensagem de teste enviada para ${to}.`);
    } catch (err) { log(err.message); }
  });

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
