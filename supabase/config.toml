# ============================================================================
# Smart Billing — Configuração do Supabase CLI para as Edge Functions
# ----------------------------------------------------------------------------
# Não desativa a verificação de JWT globalmente: só têm verify_jwt = false as
# functions chamadas sem sessão de usuário do Supabase — o webhook e a
# consulta pública de retorno do checkout InfinitePay, e o agente local de
# WhatsApp (que se autentica com seu próprio token, não com um JWT).
# ============================================================================

[functions.create-infinitepay-checkout]
verify_jwt = true

[functions.infinitepay-webhook]
verify_jwt = false

[functions.check-infinitepay-payment]
verify_jwt = false

# Página pública oferta.html (sem login) — a "autenticação" é o próprio
# offer_token secreto e imprevisível, validado dentro da function via
# select_plan_offer() (restrita a service_role no banco).
[functions.select-plan-offer]
verify_jwt = false

# Página pública cobranca-publica.html (sem login), só usada quando a
# cobrança está vencida — a "autenticação" é o public_token secreto e
# imprevisível da própria cobrança.
[functions.create-checkout-for-token]
verify_jwt = false

[functions.send-receipt-email]
verify_jwt = true

# O agente local não tem sessão de usuário Supabase — autentica com o header
# x-agent-token (WHATSAPP_AGENT_TOKEN), validado manualmente dentro da function.
[functions.whatsapp-agent-api]
verify_jwt = false
